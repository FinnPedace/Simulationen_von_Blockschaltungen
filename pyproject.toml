[project]
name = "simulationen-von-blockschaltungen"
version = "0.1.0"
description = "Fortgeschritten-Praktikum zur Erstellung eines Packages für die Simulation von Quantenschaltungen"
readme = "README.md"
authors = [
    { name = "Finn Pedace", email = "finnpedace@outlook.de" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["NPY"]
